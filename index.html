<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selecciona tu Dispositivo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #002b5c, #005ea8);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            color: white;
        }
        .selection-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .device-box {
            cursor: pointer;
            padding: 30px;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            text-decoration: none;
            color: white;
            display: block;
        }
        .device-box:hover {
            background: #ffd166;
            color: #002b5c !important;
            transform: translateY(-10px);
        }
        .device-icon {
            font-size: 80px;
            display: block;
            margin-bottom: 15px;
        }
        h2 { font-weight: bold; margin-bottom: 30px; }
        span { font-size: 20px; font-weight: 600; }
    </style>
</head>
<body>

    <div class="container m-3" style="max-width: 700px;">
        <div class="selection-card">
            <h2>¿Desde qué dispositivo accedes?</h2>
            <div class="row g-4">
                <!-- Opción Computadora -->
                <div class="col-6">
                    <a href="desktop.html" class="device-box">
                        <i class="bi bi-display device-icon"></i>
                        <span>Computadora</span>
                    </a>
                </div>
                <!-- Opción Teléfono -->
                <div class="col-6">
                    <a href="mobile.html" class="device-box">
                        <i class="bi bi-phone device-icon"></i>
                        <span>Celular</span>
                    </a>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
