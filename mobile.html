<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almacén - Vista Móvil</title>

    <!-- CORRECCIÓN CRÍTICA: Enlace oficial, completo y funcional a la librería de SheetJS -->
    <script src="https://jsdelivr.net"></script>

    <style>
        html, body {
            height: 100vh;
            margin: 0;
            padding: 0;
            background-image: url("opc2.jpg");
            background-size: cover;
            background-position: center top;
            background-repeat: no-repeat;
            background-attachment: fixed; 
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background-color: #f4f6f9;
            overflow-x: hidden;
        }

        .navbar {
            background: linear-gradient(90deg, #002b5c, #005ea8);
            box-shadow: 0 4px 10px rgba(0, 0, 0, .20);
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .navbar-brand { 
            color: #FFF !important; 
            font-weight: bold; 
            font-size: 18px;
            text-decoration: none;
            cursor: pointer;
        }

        .btn-regresar { 
            color: #ffd166; 
            font-size: 24px; 
            text-decoration: none; 
            font-weight: bold;
        }

        .main-container { padding: 15px; margin-top: 10px; }

        .search-wrapper {
            background: white;
            padding: 12px 20px;
            border-radius: 50px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            display: flex;
            align-items: center;
            border: 2px solid #005ea8;
            margin-bottom: 15px;
        }

        #searchInputAdvanced { 
            border: none; 
            outline: none; 
            width: 100%; 
            font-size: 16px; 
            color: #333; 
            background: transparent;
        }

        .results-counter {
            font-size: 14px;
            font-weight: 600;
            color: white;
            background: rgba(0, 43, 92, 0.85);
            padding: 6px 14px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 15px;
        }

        .results-container { max-height: 72vh; overflow-y: auto; padding-bottom: 50px; }

        .product-card {
            background: white;
            border-radius: 12px;
            padding: 14px;
            margin-bottom: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.06);
            display: flex;
            gap: 15px;
            align-items: flex-start;
            border: 1px solid #eef2f5;
        }

        .product-img-box {
            width: 90px; height: 90px; min-width: 90px;
            border-radius: 8px; overflow: hidden;
            background-color: #e2e8f0; border: 1px solid #cbd5e1;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; color: #718096; font-size: 12px;
        }

        .product-img-box img { width: 100%; height: 100%; object-fit: cover; }
        .product-info-box { flex-grow: 1; }
        .product-title { font-size: 15px; font-weight: 700; color: #002b5c; margin-bottom: 4px; text-transform: uppercase; }
        .product-subtitle { font-size: 13px; color: #4a5568; margin-bottom: 8px; }
        .product-sku { font-size: 11px; font-weight: bold; color: #005ea8; background: #e6f0fa; padding: 3px 10px; border-radius: 20px; display: inline-block; }
        
        .status-alert {
            padding: 10px; border-radius: 8px; text-align: center; font-size: 14px; margin-bottom: 15px;
            background: #e2e8f0; color: #2d3748;
        }
        .status-error { background: #fed7d7; color: #9b2c2c; border: 1px solid #feb2b2; }
    </style>
</head>

<body>

    <!-- NAVBAR MÓVIL -->
    <div class="navbar">
        <a href="index.html" class="btn-regresar">←</a>
        <span class="navbar-brand" onclick="window.location.reload();">ALMACÉN DE PARTES</span>
        <div style="width: 24px;"></div>
    </div>

    <!-- CONTENEDOR PRINCIPAL -->
    <div class="main-container">
        <div class="search-wrapper">
            <!-- Cambiado a evento onkeyup para procesar búsquedas instantáneas -->
            <input id="searchInputAdvanced" type="text" placeholder="Escribe para buscar (Código o Nombre)..." onkeyup="filtrarContenidoMovil()">
        </div>

        <div>
            <div id="contadorResultados" class="results-counter" style="display: none;">0 artículos encontrados</div>
        </div>

        <!-- Zona de Alertas Integrada -->
        <div id="mensajeEstado" class="status-alert">Iniciando búsqueda...</div>

        <div class="results-container" id="listaResultados"></div>
    </div>

    <script>
        let datosExcel = [];

        window.addEventListener('DOMContentLoaded', () => {
            // Validación de control de la librería instalada correctamente
            if (typeof XLSX === 'undefined') {
                const estado = document.getElementById('mensajeEstado');
                estado.className = "status-alert status-error";
                estado.innerText = "❌ No se pudo cargar el motor de lectura de Excel. Revisa tus conexiones CDN.";
            } else {
                cargarExcelMovil();
            }
        });

        function cargarExcelMovil() {
            const estado = document.getElementById('mensajeEstado');
            estado.innerHTML = 'Sincronizando inventario móvil...';
            
            // CORRECCIÓN CRÍTICA: Se codifica el espacio usando "%20" obligatorio para servidores como GitHub
            fetch('busqueda%20avanzada.xlsx')
                .then(response => {
                    if (!response.ok) {
                        throw new Error("No se encontró el archivo 'busqueda avanzada.xlsx' en tu repositorio de GitHub.");
                    }
                    return response.arrayBuffer();
                })
                .then(data => {
                    const workbook = XLSX.read(new Uint8Array(data), { type: 'array' });
                    
                    // Normalización del mapeo de pestañas
                    const nombreHojaReal = workbook.SheetNames.find(n => n.trim().toLowerCase().replace(/á/g, 'a') === "busqueda avanzada");
                    
                    if (!nombreHojaReal) {
                        throw new Error("No se encontró la pestaña llamada 'Busqueda avanzada' dentro de tu archivo Excel.");
                    }
                    
                    const hojaData = workbook.Sheets[nombreHojaReal];
                    datosExcel = XLSX.utils.sheet_to_json(hojaData);
                    
                    if (datosExcel.length > 0) {
                        estado.style.display = 'none'; // Ocultamos mensaje de carga
                        renderizarTarjetasAutoZone(datosExcel);
                    } else {
                        throw new Error("La hoja de Excel seleccionada no tiene filas de datos.");
                    }
                })
                .catch(error => {
                    console.error(error);
                    estado.className = "status-alert status-error";
                    estado.innerText = "⚠️ " + (error.message || "Error al sincronizar datos.");
                });
        }

        // CORRECCIÓN: Renderizador estructurado para tarjetas dinámicas en móvil
        function renderizarTarjetasAutoZone(listaProductos) {
            const contenedor = document.getElementById('listaResultados');
            const contador = document.getElementById('contadorResultados');
            contenedor.innerHTML = '';

            contador.style.display = 'inline-block';
            contador.innerText = `${listaProductos.length} artículos listados`;

            if(listaProductos.length === 0) {
                contenedor.innerHTML = '<div class="status-alert">No hay coincidencias para tu búsqueda.</div>';
                return;
            }

            listaProductos.forEach(prod => {
                // Mapear dinámicamente las claves del JSON sin importar si el Excel viene en mayúsculas/minúsculas
                const claves = Object.keys(prod);
                const codigo = prod[claves.find(k => k.toLowerCase().includes('cod') || k.toLowerCase().includes('sku'))] || "N/A";
                const descripcion = prod[claves.find(k => k.toLowerCase().includes('desc') || k.toLowerCase().includes('nom'))] || "Sin descripción";
                const detalleAdicional = prod[claves.find(k => k.toLowerCase().includes('ubica') || k.toLowerCase().includes('det'))] || "";
                const urlImagen = prod[claves.find(k => k.toLowerCase().includes('img') || k.toLowerCase().includes('foto'))] || "";

                let cajaImagen = `<div class="product-img-box">SIN FOTO</div>`;
                if(urlImagen && (urlImagen.match(/\.(jpeg|jpg|gif|png)$/i) || urlImagen.includes('drive.google'))) {
                    cajaImagen = `<div class="product-img-box"><img src="${urlImagen}" alt="Parte"></div>`;
                }

                contenedor.innerHTML += `
                    <div class="product-card">
                        ${cajaImagen}
                        <div class="product-info-box">
                            <div class="product-title">${descripcion}</div>
                            ${detalleAdicional ? `<div class="product-subtitle">${detalleAdicional}</div>` : ''}
                            <div class="product-sku">Código: ${codigo}</div>
                        </div>
                    </div>
                `;
            });
        }

        // Lógica de filtrado en tiempo real en dispositivos móviles
        function filtrarContenidoMovil() {
            const textoBuscar = document.getElementById('searchInputAdvanced').value.toLowerCase().trim();
        if (textoBuscar === "") {
             renderizarTarjetasAutoZone(datosExcel);
              return;
                      }
            const resultadosFiltrados = datosExcel.filter(prod => {
                 return Object.values(prod).some(val =>
           String(val).toLowerCase().includes(textoBuscar)
            );
           });
             renderizarTarjetasAutoZone(resultadosFiltrados);
               }
